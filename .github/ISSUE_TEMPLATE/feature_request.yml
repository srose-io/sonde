name: Feature request
description: Something Sonde should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The script, command, or API you wish existed. A design change becomes an ADR in docs/decisions/ before code.
