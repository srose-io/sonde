name: Docs

# Builds the docs site (docfx over docs/ and the XML docs) and publishes it to GitHub Pages on main.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'docfx.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build the API metadata source
        run: dotnet build src/Sonde/Sonde.csproj -c Release
      - name: Build the site
        run: |
          dotnet tool install docfx --version 2.81.0 --tool-path artifacts/tools
          artifacts/tools/docfx docfx.json --warningsAsErrors
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
