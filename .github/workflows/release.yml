name: Release

# A tag `vX.Y.Z` packs every project at that version and publishes to NuGet.
# Publishing uses NuGet trusted publishing: nuget.org trusts this workflow file in this
# repository and hands each run a short-lived key, so no API key is stored anywhere.
# The maintainer's nuget.org username is the NUGET_USER repository variable.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Push the packages to NuGet (otherwise pack only)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write # the OIDC token nuget.org exchanges for a short-lived key

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Check the tag matches VersionPrefix
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          prefix=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props)
          if [ "$tag" != "$prefix" ]; then
            echo "Tag v$tag does not match VersionPrefix $prefix in Directory.Build.props" >&2
            exit 1
          fi

      - name: Build and test
        run: |
          dotnet build Sonde.sln -c Release -warnaserror -p:ContinuousIntegrationBuild=true
          dotnet test Sonde.sln --no-build -c Release --filter "Category!=EndToEnd"

      - name: Pack
        run: dotnet pack Sonde.sln --no-build -c Release -p:ContinuousIntegrationBuild=true -o artifacts/package

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg

      - name: Log in to NuGet
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: dotnet nuget push "artifacts/package/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
          generate_release_notes: true
